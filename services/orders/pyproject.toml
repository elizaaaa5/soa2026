[project]
name = "orders-service"
version = "1.0.0"
description = "Orders Service for marketplace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.120.0",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings",
    "httpx",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "openapi-python-client>=0.28.3",
    "datamodel-code-generator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
