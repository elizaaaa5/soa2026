version: '3.8'

services:
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: users-service
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=users-service
      - SERVICE_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
    networks:
      - marketplace-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  marketplace-network:
    driver: bridge
